<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LZ Manager</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/harmonyos-sans" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lz-theme')
          var theme = saved || 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (window.location.hash.indexOf('overlay') !== -1 || window.location.search.indexOf('overlay') !== -1) {
            document.documentElement.classList.add('overlay-mode')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-bg text-text select-none overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
