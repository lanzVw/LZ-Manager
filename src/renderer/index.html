<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: blob: data: http://localhost:5173 ws://localhost:5173; script-src 'self' 'unsafe-inline' http://localhost:5173; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; img-src 'self' file: data: blob: https:; connect-src 'self' file: http://localhost:5173 ws://localhost:5173 https://gamebanana.com https://*.gamebanana.com; object-src 'none'; frame-src 'none'"
    />
    <title>LZ Manager</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <!-- 字体全部本地打包（Inter / Smiley Sans，见 index.css @font-face），
         不再外链 Google Fonts / cdnfonts：断网不退化、启动不被字体请求阻塞 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lz-theme')
          var theme = saved || 'light'
          document.documentElement.setAttribute('data-theme', theme)
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
          var palette = localStorage.getItem('lz-palette') || 'default'
          document.documentElement.setAttribute('data-palette', palette)
          if (window.location.hash.indexOf('overlay') !== -1 || window.location.search.indexOf('overlay') !== -1) {
            document.documentElement.classList.add('overlay-mode')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-bg text-text select-none overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
